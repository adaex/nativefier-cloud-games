name: Build & Release

on:
  schedule:
    - cron: '0 10 * * 5' # 每周五 UTC 10:00 (北京时间 18:00)
  workflow_dispatch: # 手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Get Electron version
        id: electron
        run: echo "version=$(npm view electron version)" >> "$GITHUB_OUTPUT"

      - name: Build apps
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_ENV"
          npx tsx packager/cli.ts webs/*/config.json
        env:
          ELECTRON_VERSION: ${{ steps.electron.outputs.version }}

      - name: Zip apps
        run: |
          for dir in webs/*/; do
            app_id=$(basename "$dir")
            app_name=$(node -e "process.stdout.write(require('./${dir}config.json').name)")
            app_dir="dist/${app_name}-darwin-arm64"
            app=$(find "$app_dir" -maxdepth 1 -name "*.app" -type d | head -1)
            if [ -n "$app" ]; then
              printf '%s\n' '#!/usr/bin/env bash' \
                'set -euo pipefail' \
                'cd "$(dirname "$0")"' \
                'app=$(find . -maxdepth 1 -name "*.app" -type d | head -1)' \
                'if [ -z "$app" ]; then echo "未找到 .app"; exit 1; fi' \
                'name=$(basename "$app")' \
                'xattr -dr com.apple.quarantine "$app"' \
                'rm -rf "/Applications/$name"' \
                'cp -R "$app" "/Applications/$name"' \
                'echo "已安装: /Applications/$name"' \
                > "$app_dir/install.sh"
              chmod +x "$app_dir/install.sh"
              ditto -c -k "$app_dir" "dist/${app_id}-darwin-arm64.zip"
              echo "Zipped: ${app_id}-darwin-arm64.zip"
            fi
          done

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          ELECTRON_VER: ${{ steps.electron.outputs.version }}
        run: |
          tag="v${ELECTRON_VER}"

          # 生成应用列表
          apps=""
          for dir in webs/*/; do
            app_name=$(node -e "process.stdout.write(require('./${dir}config.json').name)")
            app_url=$(node -e "process.stdout.write(require('./${dir}config.json').url)")
            apps="${apps}- **${app_name}** — ${app_url}"$'\n'
          done

          # 写入 Release notes 文件
          elapsed=$(( $(date +%s) - start ))
          build_time=$(TZ=Asia/Shanghai date "+%Y-%m-%d %H:%M CST")
          {
            echo "基于 Electron ${ELECTRON_VER} 构建的云游戏客户端。"
            echo ""
            echo "### 包含应用"
            echo ""
            printf "%s" "$apps"
            echo ""
            echo "### 安装方式"
            echo ""
            echo "1. 下载对应的 zip 文件并解压"
            echo '2. 在解压目录中运行 `./install.sh`（会自动移除隔离标记并复制到 /Applications）'
            echo ""
            echo "### 构建信息"
            echo ""
            echo "- Platform: macOS (darwin-arm64)"
            echo "- Electron: ${ELECTRON_VER}"
            echo "- Node: $(node --version)"
            echo "- 构建时间: ${build_time}"
            echo "- 耗时: ${elapsed}s"
          } > /tmp/release-notes.md

          # 同一 Electron 版本已有 Release 则删除重建（上次可能上传失败）
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release delete "$tag" --yes
            git push --delete origin "$tag" 2>/dev/null || true
          fi
          gh release create "$tag" dist/*.zip \
            --title "$tag" \
            --notes-file /tmp/release-notes.md \
            --latest
