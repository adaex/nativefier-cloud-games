name: Build & Release

on:
  schedule:
    - cron: '0 7 * * 1,5' # 每周一、五 UTC 07:00 (北京时间 15:00)
  workflow_dispatch: # 手动触发

permissions:
  contents: write

# 同一 Release 的构建与上传必须串行，避免定时和手动运行交叉覆盖 asset
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Get Electron version
        id: electron
        run: echo "version=$(npm view electron version)" >> "$GITHUB_OUTPUT"

      # Electron 二进制（~100MB）按版本缓存，避免每次全量下载
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ steps.electron.outputs.version }}

      - name: Build apps
        run: node packager/cli.ts
        env:
          ELECTRON_VERSION: ${{ steps.electron.outputs.version }}

      # manifest 是后续 Zip / Release 的唯一数据源，集中校验一次；
      # 之后的 step 直接信任它非空（process substitution 会吞掉退出码，故不在其内重复校验）
      - name: Verify manifest
        run: node -e "const m=require('./dist/manifest.json'); if(!Array.isArray(m)||m.length===0){console.error('❌ dist/manifest.json 为空或缺失');process.exit(1)}"

      - name: Zip apps
        run: |
          set -euo pipefail
          # install.sh 已由构建阶段生成在 $app_dir 内，这里只负责打 zip
          # zip 名用 id-slug（数字 id 防撞 + 域名 slug 可读）
          while IFS=$'\t' read -r app_id app_slug app_dir; do
            app=$(find "$app_dir" -maxdepth 1 -name "*.app" -type d | head -1)
            if [ -z "$app" ]; then echo "❌ 未找到 .app: $app_dir"; exit 1; fi
            ditto -c -k "$app_dir" "dist/${app_id}-${app_slug}-darwin-arm64.zip"
            echo "Zipped: ${app_id}-${app_slug}-darwin-arm64.zip"
          done < <(node -e "for(const a of require('./dist/manifest.json')) process.stdout.write(a.id+'\t'+a.slug+'\t'+a.appPaths[0]+'\n')")

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          ELECTRON_VER: ${{ steps.electron.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${ELECTRON_VER}"

          # 生成应用列表（含文件大小），数据来自本次精简 manifest
          apps=""
          while IFS=$'\t' read -r app_id app_slug app_name app_url; do
            zip_file="dist/${app_id}-${app_slug}-darwin-arm64.zip"
            size=$(du -h "$zip_file" | cut -f1 | xargs)
            apps="${apps}- **${app_name}** — ${app_url} (${size})"$'\n'
          done < <(node -e "for(const a of require('./dist/release-manifest.json')) process.stdout.write(a.id+'\t'+a.slug+'\t'+a.name+'\t'+a.url+'\n')")

          {
            echo "基于 Electron ${ELECTRON_VER} 构建的 macOS arm64 云游戏客户端。"
            echo ""
            echo "### 包含应用"
            echo ""
            printf "%s" "$apps"
            echo ""
            echo "### 安装方式"
            echo ""
            echo "1. 下载对应的 zip 文件并解压"
            echo '2. 在解压目录中运行 `./install.sh`（会自动移除隔离标记并复制到 /Applications）'
          } > /tmp/release-notes.md

          # zip 的 SHA256 校验值，安装器下载后校验完整性（镜像下载场景的防篡改手段）
          (cd dist && shasum -a 256 *.zip > checksums.txt)

          # 已有 tag 就地更新，asset 用 --clobber 覆盖；构建失败不会执行本步骤
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file /tmp/release-notes.md --latest
          else
            gh release create "$tag" --title "$tag" --notes-file /tmp/release-notes.md --latest
          fi
          gh release upload "$tag" dist/*.zip dist/release-manifest.json dist/checksums.txt --clobber
